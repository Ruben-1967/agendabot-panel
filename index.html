    <!-- Manifest por defecto: panel de negocio (mayoría de las instalaciones,
         ej. LuxVision, Ahorróptica, Alejandro Barber). Para /vendedor/* se

         src/main.jsx. Bug real corregido 2026-09-22: antes SIEMPRE se servía

         negocio que instalaba la app terminaba en el login equivocado, sin
         el link de "¿Olvidaste tu contraseña?" (que solo existe en el login
         de negocio). -->
    <link rel="manifest" href="/manifest-negocio.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#2F6F62" />
